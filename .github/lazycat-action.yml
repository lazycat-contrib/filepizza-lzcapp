version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/filepizza.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: filepizza
    bump: patch

build:
  run_buildscript: false

images:
  # 主应用：上游无 semver 家族（1.x 为旧版，2.0.0 无 tag），只有 latest/main/master 等 mutable tag → custom + created + bump
  - id: filepizza
    target: service
    service: filepizza
    source: kern/filepizza
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: lazycat
  # 辅助 redis：跟随 7.4-alpine 补丁家族
  - id: redis
    target: service
    service: redis
    source: library/redis
    channel: custom
    sort: semver
    tag_regex: '^7\.4\.\d+-alpine$'
    version_regex: '^(?P<version>7\.4\.\d+)-alpine$'
    version_template: '{version}'
    delivery:
      mode: lazycat
  # 辅助 coturn：跟随 4.x.y-alpine 补丁家族（排除 -r0/-r1 变体与 4-alpine 浮动别名）
  - id: coturn
    target: service
    service: coturn
    source: coturn/coturn
    channel: custom
    sort: semver
    tag_regex: '^4\.\d+\.\d+-alpine$'
    version_regex: '^(?P<version>4\.\d+\.\d+)-alpine$'
    version_template: '{version}'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: FilePizza
    summary: "浏览器中的点对点文件传输"
