application:
  subdomain: filepizza
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://filepizza:8080/
  ingress:
    - protocol: tcp
      port: 6379
      service: redis
    - protocol: tcp
      port: 3478
      service: coturn
    - protocol: udp
      port: 3478
      service: coturn
    - protocol: tcp
      port: 5349
      service: coturn
    - protocol: udp
      port: 5349
      service: coturn
services:
  redis:
    # upstream: library/redis:7.4.12-alpine
    image: registry.lazycat.cloud/czyt/library/redis:6e756a19809c1a16
    binds:
      - /lzcapp/var/data:/data
  coturn:
    # upstream: coturn/coturn:4.18.0-alpine
    image: registry.lazycat.cloud/czyt/coturn/coturn:59c2e5e99f8b5f12
    environment:
      - DETECT_EXTERNAL_IP=yes
      - DETECT_RELAY_IP=yes
    command: -n --log-file=stdout --redis-userdb="ip=redis connect_timeout=30"
  filepizza:
    # upstream: kern/filepizza:latest@sha256:b290bc42d2cf01ac23cb1ac4e676aee5b5b1d1bd4c44e1b7f262c6a2cbd8230c
    image: registry.lazycat.cloud/czyt/kern/filepizza:b85f8017bea28889
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
