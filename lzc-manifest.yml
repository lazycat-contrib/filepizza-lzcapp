application:
  subdomain: filepizza
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://filepizza:8080/
  ingress:
    - protocol: tcp
      port: 6379
      service: redis
    - protocol: tcp
      port: 3478
      service: coturn
    - protocol: udp
      port: 3478
      service: coturn
    - protocol: tcp
      port: 5349
      service: coturn
    - protocol: udp
      port: 5349
      service: coturn
services:
  redis:
    # upstream: library/redis:7.4.12-alpine
    image: registry.lazycat.cloud/czyt/library/redis:6e756a19809c1a16
    binds:
      - /lzcapp/var/data:/data
  coturn:
    # upstream: coturn/coturn:4.19.2-alpine
    image: registry.lazycat.cloud/czyt/coturn/coturn:adba21a4becb4ed3
    environment:
      - DETECT_EXTERNAL_IP=yes
      - DETECT_RELAY_IP=yes
    command: -n --log-file=stdout --redis-userdb="ip=redis connect_timeout=30"
  filepizza:
    # upstream: kern/filepizza:latest@sha256:ed899d51c747a647486363ff154cd4efe1a2f0a6e1ec2f3707c1bb340d371abd
    image: registry.lazycat.cloud/czyt/kern/filepizza:3e25ae6697f74247
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
