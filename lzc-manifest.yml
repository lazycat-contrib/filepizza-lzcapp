application:
  subdomain: filepizza
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://filepizza:8080/
  ingress:
    - protocol: tcp
      port: 6379
      service: redis
    - protocol: tcp
      port: 3478
      service: coturn
    - protocol: udp
      port: 3478
      service: coturn
    - protocol: tcp
      port: 5349
      service: coturn
    - protocol: udp
      port: 5349
      service: coturn

services:
  redis:
    # upstream: redis:7.4.11-alpine
    image: redis:7.4.11-alpine
    binds:
      - /lzcapp/var/data:/data
  coturn:
    # upstream: coturn/coturn:4.18.0-alpine
    image: coturn/coturn:4.18.0-alpine
    environment:
      - DETECT_EXTERNAL_IP=yes
      - DETECT_RELAY_IP=yes
    command: -n --log-file=stdout --redis-userdb="ip=redis connect_timeout=30"
  filepizza:
    # upstream: kern/filepizza:latest
    image: kern/filepizza:latest
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
